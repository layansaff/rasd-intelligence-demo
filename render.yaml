services:
  - type: web
    name: rasd-intelligence-demo
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RASD_DEMO_MODE
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
